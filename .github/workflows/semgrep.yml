name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  SEMGREP: pipx run semgrep==1.185.0 scan --config p/default --config p/typescript --config p/github-actions --config .semgrep --metrics=off --error --sarif-output=semgrep.sarif

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The backlog is zero: every event fails on any finding. Justify a false positive inline with `// nosemgrep: <rule> -- <reason>`.
      - run: $SEMGREP
      # Semgrep writes nosemgrep-suppressed findings into the SARIF too, and code scanning opens alerts for them.
      - if: always() && hashFiles('semgrep.sarif') != ''
        run: jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > kept.sarif && mv kept.sarif semgrep.sarif
      # Results land in the Security tab next to CodeQL; runs even when the scan fails.
      - if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
