name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SEMGREP: pipx run semgrep==1.185.0 scan --config p/default --config p/typescript --config p/github-actions --metrics=off

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # ponytail: PRs fail only on findings they introduce; main/weekly scans report the existing backlog without failing.
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: $SEMGREP --error --baseline-commit "$BASE_SHA"
      - if: github.event_name != 'pull_request'
        run: $SEMGREP
