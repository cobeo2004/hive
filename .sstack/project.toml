# .sstack/project.toml — repo-only project settings. Replaced whole by `local/project.toml`.
brief  = ".sstack/product.md"
docs   = ["docs/prd.md", "docs/glossary.md", "docs/operations.md"]
# bun 1.4.4 (package.json packageManager); next typegen writes route types into .next/ for tsc.
# ponytail: test:regressions left out — it needs a Postgres in TEST_DATABASE_URL, and
# playbook-regressions fails until R13 (M4). Run it by hand via [test.code].
verify = [
  "bun run lint",
  "bunx next typegen && bunx tsc --noEmit",
  "bun run format:check",                 # CI format job (lesson L17)
]
# Applied migrations are immutable; a new drizzle/NNNN_*.sql still passes.
protected = ["drizzle/0*.sql"]
check  = "bunx eslint {path}"
graph  = true

[test.code]
framework = "bun scripts, scripts/<name>-regressions.ts, each against a throwaway hive_test_* database on TEST_DATABASE_URL (docs/operations.md § Testing)"
run       = "TEST_DATABASE_URL=postgres://localhost/postgres bun run test:regressions {path}"   # {path} = name prefix, e.g. ingest

# No e2e runner: UI changes get a live check in the T3 Code browser (preview_* tools).
[test.browser]
framework = "none: live check in the T3 Code browser"
serve     = "bun run dev"                        # needs .env.local (database, auth)
url       = "http://localhost:3000"
run       = ""

# No native app: the panel is checked in a mobile browser on a T3 Code device (device_* tools).
[test.mobile]
framework = "none: panel in a mobile browser on a T3 Code device"
build     = ""
run       = ""

# Read by dispatched children whose --files match. Repo docs outrank third-party skills.
[practices]
"app/**"        = ["vercel-react-best-practices", "docs/operations.md"]
"components/**" = ["vercel-react-best-practices", "docs/operations.md"]
"db/**"         = ["docs/operations.md"]
"drizzle/**"    = ["docs/operations.md"]
"lib/**"        = ["docs/operations.md"]
"runner/**"     = ["docs/operations.md"]
"functions/**"  = ["docs/operations.md"]
"docs/**"       = ["docs/glossary.md"]
"playbooks/**"  = ["docs/glossary.md"]
