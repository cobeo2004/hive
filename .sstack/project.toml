# .sstack/project.toml — repo-only project settings. Replaced whole by `local/project.toml`.
brief  = ".sstack/product.md"
docs   = ["docs/prd.md", "docs/glossary.md", "docs/operations.md"]
# bun 1.4.4 (package.json packageManager); next typegen writes route types into .next/ for tsc.
# ponytail: test:regressions left out — it needs a Postgres in TEST_DATABASE_URL, and
# playbook-regressions fails until R13 (M4). Run it by hand via [test.code].
verify = [
  "bun run lint",
  "bunx next typegen && bunx tsc --noEmit",
  "bun run format:check",                 # CI format job (lesson L17)
]
# Applied migrations are immutable; a new drizzle/NNNN_*.sql still passes.
protected = ["drizzle/0*.sql"]
check  = "bunx eslint {path}"
graph  = true

[test.code]
framework = "bun scripts, scripts/<name>-regressions.ts, each against a throwaway hive_test_* database on TEST_DATABASE_URL (docs/operations.md § Testing)"
run       = "TEST_DATABASE_URL=postgres://localhost/postgres bun run test:regressions {path}"   # {path} = name prefix, e.g. ingest

# No e2e runner: UI changes get a live check in the T3 Code browser (preview_* tools).
[test.browser]
framework = "none: live check in the T3 Code browser"
serve     = "bun run dev"                        # needs .env.local (database, auth)
url       = "http://localhost:3000"
run       = ""

# No native app: the panel is checked in a mobile browser on a T3 Code device (device_* tools).
[test.mobile]
framework = "none: panel in a mobile browser on a T3 Code device"
build     = ""
run       = ""

# Read by dispatched children whose --files match. Repo docs outrank third-party skills; order is read order.
# fnmatch `*` crosses `/` and there is no negation, so app/ is split by area instead of one "app/**".
# Every doc path must exist and every skill must be installed, or dispatch hands the child a dead link (L72).
[practices]
# --- UI: the panel -------------------------------------------------------------
"app/(panel)/**"        = ["docs/conventions/ui.md", "vercel-react-best-practices"]
"app/auth/**"           = ["docs/conventions/ui.md", "docs/conventions/auth.md", "vercel-react-best-practices"]
"app/setup/**"          = ["docs/conventions/ui.md", "docs/conventions/auth.md", "vercel-react-best-practices"]
"app/actions/**"        = ["docs/conventions/auth.md", "vercel-react-best-practices"]
"app/layout.tsx"        = ["docs/conventions/ui.md", "vercel-react-best-practices"]
"app/globals.css"       = ["docs/conventions/ui.md"]
"components/**"         = ["docs/conventions/ui.md", "vercel-react-best-practices", "responsive-design"]
"design/**"             = ["docs/conventions/ui.md"]
# --- HTTP routes (ingest, webhooks, live SSE, Slack) ---------------------------
"app/api/**"            = ["docs/operations.md"]
"proxy.ts"              = ["docs/conventions/auth.md"]
# --- runner and host code ------------------------------------------------------
"runner/**"             = ["docs/conventions/runner.md", "docs/operations.md"]
"lib/toml-patch.ts"     = ["docs/conventions/runner.md"]
"lib/t3-*.ts"           = ["docs/conventions/runner.md"]
"lib/modal-*.ts"        = ["docs/conventions/runner.md"]
"lib/sandbox*.ts"       = ["docs/conventions/runner.md"]
"lib/host.ts"           = ["docs/conventions/runner.md"]
"lib/exec.ts"           = ["docs/conventions/runner.md"]
# --- shared lib ----------------------------------------------------------------
"lib/**"                = ["docs/conventions/lib.md", "docs/operations.md"]
"lib/auth/**"           = ["docs/conventions/auth.md"]
# --- database (db.md outranks the postgres-drizzle skill) ----------------------
"db/**"                 = ["docs/conventions/db.md", "postgres-drizzle"]
"drizzle/**"            = ["docs/conventions/db.md", "postgres-drizzle"]
# --- regressions ---------------------------------------------------------------
"scripts/*-regressions.ts" = ["docs/conventions/regressions.md"]
"scripts/fixtures/**"   = ["docs/conventions/regressions.md"]
"scripts/test-*.ts"     = ["docs/conventions/regressions.md"]
# --- integrations and prose ----------------------------------------------------
"hooks/**"              = ["docs/hooks-observed.md"]
"mcp/**"                = ["docs/hooks-observed.md"]
"playbooks/**"          = ["docs/glossary.md"]
"docs/**"               = ["docs/glossary.md"]
